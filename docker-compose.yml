version: '3.8'

services:
  # OpenCode AI Coordinator
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: open_coordinator
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./open_coordinator:/home/appuser/app/open_coordinator
      - ./.env:/home/appuser/app/.env
      - ./logs:/home/appuser/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    env_file:
      - .env
    networks:
      - open_coordinator_network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: open_coordinator_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - open_coordinator_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: open_coordinator_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - coordinator
    networks:
      - open_coordinator_network

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: open_coordinator_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - open_coordinator_network

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: open_coordinator_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - open_coordinator_network

networks:
  open_coordinator_network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
